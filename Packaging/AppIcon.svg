<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7DEB8"/>
      <stop offset="1" stop-color="#D2904F"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9E5631"/>
      <stop offset="1" stop-color="#5A2C15"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B96A3B"/>
      <stop offset="1" stop-color="#8C4724"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="230" fill="url(#background)"/>

  <!-- Shadow under the box -->
  <ellipse cx="512" cy="814" rx="286" ry="32" fill="#5A2C15" fill-opacity="0.18"/>

  <!-- Inside of the box, visible under the open lid -->
  <rect x="196" y="418" width="632" height="140" rx="34" fill="#35180B"/>

  <!-- Cigars resting inside -->
  <g transform="rotate(-6 512 452)">
    <rect x="286" y="424" width="404" height="52" rx="26" fill="#C98C52"/>
    <rect x="286" y="424" width="92" height="52" rx="26" fill="#8A5A2B"/>
    <rect x="566" y="424" width="64" height="52" fill="#E8C468"/>
  </g>
  <g transform="rotate(4 512 486)">
    <rect x="322" y="474" width="404" height="52" rx="26" fill="#B87B45"/>
    <rect x="322" y="474" width="92" height="52" rx="26" fill="#7A4E24"/>
  </g>

  <!-- Box -->
  <rect x="196" y="536" width="632" height="272" rx="48" fill="url(#box)"/>
  <rect x="254" y="592" width="516" height="162" rx="30" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="10"/>

  <!-- Lid, hinged at the back -->
  <g transform="rotate(-11 210 430)">
    <rect x="180" y="352" width="664" height="92" rx="30" fill="url(#lid)"/>
    <rect x="180" y="352" width="664" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.2"/>
  </g>

  <!-- Latch -->
  <rect x="470" y="644" width="84" height="66" rx="20" fill="#E8C468"/>
  <rect x="496" y="668" width="32" height="18" rx="9" fill="#7A4E24"/>
</svg>
